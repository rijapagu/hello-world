name: Laravel CI

# Tres comprobaciones independientes: formato, análisis estático y tests.
# Configúralas como "required status checks" en el ruleset de la rama main
# (ver CONTRIBUTING.md) para que ningún PR se pueda fusionar en rojo.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"   # versión principal del proyecto
  MIN_COVERAGE: "60"   # % mínimo de cobertura sobre app/. Súbelo con el tiempo; nunca lo bajes.

jobs:
  lint:
    name: Formato (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}

      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test

  analyse:
    name: Análisis estático (Larastan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G --error-format=github

      - name: Vulnerabilidades conocidas en dependencias
        # Informativo al principio; cambia a "false" cuando el equipo quiera que bloquee el PR.
        continue-on-error: true
        run: composer audit

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]   # añade "8.3" si el proyecto debe seguir soportándolo (Pest 5 exige 8.4)
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate --ansi

      - name: Pest (paralelo, con cobertura mínima)
        run: |
          vendor/bin/pest --parallel --ci \
            --coverage --min=${{ env.MIN_COVERAGE }} \
            --coverage-clover=build/coverage.xml \
            --log-junit=build/junit.xml

      - name: Informes de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-php-${{ matrix.php }}
          path: build/
          if-no-files-found: ignore
